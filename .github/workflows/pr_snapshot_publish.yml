name: PR Snapshot Publish
run-name: Snapshot publish for PR #${{ github.event.pull_request.number }}

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  detect:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      jira_key: ${{ steps.jira.outputs.key }}
      snapshot_version: ${{ steps.version.outputs.snapshot_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract JIRA key from PR title
        id: jira
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          KEY=$(echo "$PR_TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1 || true)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          if [ -z "$KEY" ]; then
            echo "::warning::No JIRA key found in PR title. Skipping snapshot publish."
          fi

      - name: Compute snapshot version
        id: version
        if: steps.jira.outputs.key != ''
        run: |
          BASE=$(node -p "require('./package.json').version")
          SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha }}" | cut -c1-7)
          SNAPSHOT="${BASE}-${{ steps.jira.outputs.key }}-SNAPSHOT.${SHORT_SHA}"
          echo "snapshot_version=$SNAPSHOT" >> "$GITHUB_OUTPUT"
          echo "Snapshot version: $SNAPSHOT"

  publish:
    needs: detect
    if: needs.detect.outputs.jira_key != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@zaiusinc'

      - name: Install
        run: yarn install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: yarn build

      - name: Set snapshot version
        run: npm version --no-git-tag-version ${{ needs.detect.outputs.snapshot_version }}

      - name: Publish snapshot
        run: npm publish --access restricted --tag ${{ needs.detect.outputs.jira_key }}-snapshot
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  comment:
    needs: [detect, publish]
    if: always() && needs.detect.outputs.jira_key != ''
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const snapshotVersion = '${{ needs.detect.outputs.snapshot_version }}';
            const jiraKey = '${{ needs.detect.outputs.jira_key }}';
            const distTag = `${jiraKey}-snapshot`;
            const success = '${{ needs.publish.result }}' === 'success';
            const status = success ? ':white_check_mark:' : ':x:';
            const marker = '<!-- snapshot-artifacts -->';
            const body = [
              marker,
              '## Snapshot Artifacts',
              '',
              '| Package | Artifact | Status |',
              '|---------|----------|--------|',
              `| @zaiusinc/app-sdk | \`@zaiusinc/app-sdk@${snapshotVersion}\` | ${status} |`,
              '',
              `Or track the latest push for this PR via dist-tag: \`@zaiusinc/app-sdk@${distTag}\``,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
